<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Store</title>
    <!-- prerender:head -->
    <style>
      /* Splash: self-contained so it paints before the app stylesheet/fonts/config are ready. */
      #os-splash{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#faf8f5;transition:opacity .35s ease,visibility .35s}
      #os-splash.os-hide{opacity:0;visibility:hidden;pointer-events:none}
      #os-splash .os-ring{width:44px;height:44px;border-radius:50%;border:3px solid rgba(59,63,143,.18);border-top-color:#3b3f8f;animation:os-spin .8s linear infinite}
      #os-splash .os-dots{display:flex;gap:6px;margin-top:18px;justify-content:center}
      #os-splash .os-dots i{width:6px;height:6px;border-radius:50%;background:#3b3f8f;opacity:.25;animation:os-pulse 1.1s ease-in-out infinite}
      #os-splash .os-dots i:nth-child(2){animation-delay:.15s}#os-splash .os-dots i:nth-child(3){animation-delay:.3s}
      @keyframes os-spin{to{transform:rotate(360deg)}}
      @keyframes os-pulse{50%{opacity:1;transform:translateY(-3px)}}
      @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #os-splash{background:#0b0d12}:root:not([data-theme="light"]) #os-splash .os-ring{border-color:rgba(180,184,255,.2);border-top-color:#b4b8ff}:root:not([data-theme="light"]) #os-splash .os-dots i{background:#b4b8ff}}
      :root[data-theme="dark"] #os-splash{background:#0b0d12}:root[data-theme="dark"] #os-splash .os-ring{border-color:rgba(180,184,255,.2);border-top-color:#b4b8ff}:root[data-theme="dark"] #os-splash .os-dots i{background:#b4b8ff}
      @media (prefers-reduced-motion:reduce){#os-splash .os-ring,#os-splash .os-dots i{animation:none}}
    </style>
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <script>
      // Apply stored theme before paint to avoid a flash.
      try { var m = localStorage.getItem("os-theme"); if (m && m !== "system") document.documentElement.setAttribute("data-theme", m); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="os-splash" role="status" aria-live="polite"><div><div class="os-ring"></div><div class="os-dots"><i></i><i></i><i></i></div></div></div>
    <script>
      // Failsafe: never keep the splash up for more than 8s, even if the app fails to boot.
      setTimeout(function () { var s = document.getElementById("os-splash"); if (s) s.className = "os-hide"; }, 8000);
    </script>
    <div id="root"><!-- prerender:body --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
