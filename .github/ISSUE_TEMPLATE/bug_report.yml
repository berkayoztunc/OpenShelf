name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue? Do NOT open a public issue. See SECURITY.md."
  - type: textarea
    id: what
    attributes: { label: "What happened?", description: "Expected vs actual behavior" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: OpenShelf version / commit }
  - type: textarea
    id: logs
    attributes: { label: Logs, description: "Remove all secrets, tokens and personal data first.", render: shell }
